[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # panda_common 的 pydantic v1 風格用法在 import 期即發出，與本次重構無關
    ignore:Using extra keyword arguments on `Field` is deprecated.*:DeprecationWarning
    ignore:Pydantic V1 style `@validator` validators are deprecated.*:DeprecationWarning
    ignore::DeprecationWarning:pkg_resources.*:
    # factor.py:215 使用 pd.Grouper(freq='M')，pandas 2.x 已改建議 'ME'。
    # 這是既有 production 行為，golden-master 刻意保留現況，不在此次重構修正。
    ignore:.*'M' is deprecated.*:FutureWarning
