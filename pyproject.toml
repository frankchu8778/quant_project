[project]
name = "quant research"
version = "0.1.0"
description = ""
authors = [
    {name = "Newt", email = "frankreally87@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "duckdb>=1.4.2",
    "clickhouse-connect>=0.9.1",
    "jupyter>=1.1.1",
    "notebook>=7.5.0",
    "pandas<2.2",
    "tqdm>=4.67.1",
    "pyarrow>=22.0.0",
    "python-dotenv>=1.2.1",
    "numpy>=1.26.4",
    "cython>=3.2.4",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
    "packaging>=25.0",
    "FinMind>=1.9.3",
    "plotly>=6.5.2",
    "chardet>=5.2.0",
    "shioaji>=1.3.1",
    "seaborn>=0.13.2",
    "telebot>=0.0.5",
    "polars>=1.42.1",
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]

[tool.pdm.build]
# 這告訴 PDM：請把這兩個資料夾視為 Package 的一部分
includes = ["src", "data_manager"]

# 建構系統配置 (PDM 的標準配置，保持不變)
[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"



[tool.pdm]
